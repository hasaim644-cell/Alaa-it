<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>من نحن | Gym Management System</title>

<link rel="stylesheet" href="stylabut.css">

</head>

<body>

<!-- =====================================
     Navigation
====================================== -->

<header class="navbar">

    <div class="logo">

        🏋️

        <span
            data-ar="نظام إدارة الصالة الرياضية"
            data-en="Gym Management System">
        </span>

    </div>


    <ul id="navLinks"></ul>


    <div class="nav-buttons">

        <button
            id="darkModeBtn"
            title="الوضع الليلي">
            🌙
        </button>


        <button id="languageBtn">
            EN
        </button>

    </div>

</header>



<!-- =====================================
     About Page
====================================== -->

<main id="aboutPage"></main>



<!-- =====================================
     Footer
====================================== -->

<footer>

    <h3>

        🏋️

        <span
            data-ar="نظام إدارة الصالة الرياضية"
            data-en="Gym Management System">
        </span>

    </h3>


    <p
        data-ar="نظام متكامل لإدارة الصالة الرياضية"
        data-en="An integrated system for managing your gym.">
    </p>


    <div class="footer-links">

        <h4
            data-ar="صفحات الموقع"
            data-en="Website Pages">
        </h4>

        <ul id="footerLinks"></ul>

    </div>


    <p class="copyright">

        © 2026

        <span
            data-ar="جميع الحقوق محفوظة"
            data-en="All Rights Reserved">
        </span>

    </p>

</footer>



<!-- =====================================
     Toast Message
====================================== -->

<div id="toastMessage" class="toast-message">

    <div class="toast-icon">
        ✓
    </div>


    <div>

        <strong id="toastTitle"></strong>

        <p id="toastText"></p>

    </div>

</div>



<!-- =====================================
     Back To Top
====================================== -->

<button
    id="backToTop"
    title="العودة إلى الأعلى">

    ↑

</button>



<script src="about.js"></script>

</body>

</html>
