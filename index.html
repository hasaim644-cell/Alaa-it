<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gym Management System</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =====================================
     NAVBAR
====================================== -->

<header class="navbar">

    <div class="logo">

        🏋️

        <span
            data-ar="نظام إدارة الصالة الرياضية"
            data-en="Gym Management System">
        </span>

    </div>


    <ul id="navLinks"></ul>


    <div class="nav-buttons">

        <button
            id="darkModeBtn"
            title="الوضع الليلي">
            🌙
        </button>


        <button id="languageBtn">
            EN
        </button>

    </div>

</header>


<!-- =====================================
     HERO
====================================== -->

<section id="hero"></section>


<!-- =====================================
     WELCOME
====================================== -->

<section class="welcome-section">

    <h2 id="welcome"></h2>


    <p
        data-ar="اكتشف أفضل التمارين والبرامج التدريبية وابدأ رحلتك نحو جسم أقوى وصحة أفضل."
        data-en="Discover the best workouts and training programs and start your journey toward a stronger body and better health.">
    </p>


    <button id="startBtn">

        <span
            data-ar="ابدأ الآن"
            data-en="Start Now">
        </span>

    </button>

</section>


<!-- =====================================
     CLOCK
====================================== -->

<section class="clock-section">

    <h2
        data-ar="الوقت الحالي"
        data-en="Current Time">
    </h2>


    <p id="clock"></p>

</section>


<!-- =====================================
     FOOTER
====================================== -->

<footer>

    <h3>

        🏋️

        <span
            data-ar="نظام إدارة الصالة الرياضية"
            data-en="Gym Management System">
        </span>

    </h3>


    <p
        data-ar="نظام متكامل لإدارة الصالة الرياضية"
        data-en="An integrated system for managing your gym.">
    </p>


    <div class="footer-links">

        <h4
            data-ar="صفحات الموقع"
            data-en="Website Pages">
        </h4>


        <ul id="footerLinks"></ul>

    </div>


    <p class="copyright">

        © 2026

        <span
            data-ar="جميع الحقوق محفوظة"
            data-en="All Rights Reserved">
        </span>

    </p>

</footer>


<!-- =====================================
     BACK TO TOP
====================================== -->

<button
    id="backToTop"
    title="العودة إلى الأعلى">

    ↑

</button>


<script src="script.js"></script>

</body>

</html>
